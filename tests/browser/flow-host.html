<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic client flow rehearsal</title><style>body{font:16px/1.6 system-ui;background:#eef2e8;color:#173b35;margin:0}main{max-width:1200px;margin:auto;padding:24px}button{padding:12px 18px;cursor:pointer;border-radius:8px;background:#176a63;color:white;border:0}#material{padding:20px;background:#fff6d8;border:2px solid #b69546;border-radius:12px;margin-bottom:16px}pre{white-space:pre-wrap;font-size:12px}iframe{background:white}</style></head><body><main><h1>Client-controlled game activities</h1><p>Local synthetic client: no login, student records, grades, paid models or cloud requests.</p><section id="material" hidden><h2 id="title"></h2><p id="reference"></p><p>This synthetic activity represents client-owned content. In an application, validate its real activity completion on your server before confirming.</p><button id="complete">Confirm synthetic activity</button><button id="unavailable">Report unavailable</button></section><div id="player"></div><details><summary>Observed game telemetry</summary><pre id="events"></pre></details></main><script type="module">
import {mountGame} from 'http://127.0.0.1:5180/sdk/game-studio.js';
let pending;
const section=document.querySelector('#material'), events=document.querySelector('#events');
const player=mountGame(document.querySelector('#player'),{studioOrigin:'http://127.0.0.1:5180',gameId:'11111111-1111-4111-8111-111111111111',hostId:'local-school',onMaterial(event,controls){pending=controls;document.querySelector('#title').textContent=event.node.title;document.querySelector('#reference').textContent=`${event.node.kind}: ${event.node.reference}`;section.hidden=false;},onEvent(event){events.textContent=JSON.stringify(event,null,2);if(event.type==='flow-progress'&&event.progress.status!=='material'){section.hidden=true;pending=undefined;}}});
// Substitute only the test player route while preserving the SDK-generated channel.
const source=new URL(player.iframe.src);const fixture=new URL('http://127.0.0.1:5180/tests/browser/flow-player.html');fixture.searchParams.set('channel',source.searchParams.get('channel'));player.iframe.src=fixture.href;
document.querySelector('#complete').onclick=()=>{pending?.complete();pending=undefined;section.hidden=true;};document.querySelector('#unavailable').onclick=()=>{pending?.unavailable();pending=undefined;section.hidden=true;};
</script></body></html>
