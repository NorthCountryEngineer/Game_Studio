<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic multi-game client</title><style>body{font:16px/1.6 system-ui;background:#eef2e8;color:#173b35;margin:0}main{max-width:1200px;margin:auto;padding:24px}button{padding:12px 18px;cursor:pointer;border-radius:8px;background:#176a63;color:white;border:0}#material{padding:20px;background:#fff6d8;border:2px solid #b69546;border-radius:12px;margin:16px 0}pre{white-space:pre-wrap;font-size:12px}iframe{background:white}#completion{padding:14px;background:#d9ead6;border-radius:8px}</style></head><body><main><h1>A sequence of games and client objects</h1><p>Local synthetic client. No accounts, external services or persistent records.</p><p id="completion">The main journey is in progress.</p><section id="material" hidden><h2 id="title"></h2><p id="reference"></p><p>This content belongs to the client. Confirming closes this synthetic object and lets the journey continue.</p><button id="complete">Confirm client object</button><button id="unavailable">Report unavailable</button></section><div id="player"></div><details><summary>Observed event</summary><pre id="events"></pre></details></main><script type="module">
import {mountGame} from 'http://127.0.0.1:5180/sdk/game-studio.js';
let pending, frozen;let completionEvents=0;
const section=document.querySelector('#material'), events=document.querySelector('#events'), summary=document.querySelector('#completion');
const player=mountGame(document.querySelector('#player'),{studioOrigin:'http://127.0.0.1:5180',gameId:'11111111-1111-4111-8111-111111111111',hostId:'local-school',onMaterial(event,controls){pending=controls;document.querySelector('#title').textContent=event.node.title;document.querySelector('#reference').textContent=`${event.node.kind}: ${event.node.reference}`;section.hidden=false;},onEvent(event){events.textContent=JSON.stringify(event,null,2);if(event.type==='multi-progress'){if(event.progress.status!=='material'){section.hidden=true;pending=undefined;}if(event.progress.status==='completed'){completionEvents++;frozen=event.progress.result;}if(frozen)summary.textContent=`Main journey complete: ${frozen.points} points, ${Math.round(frozen.elapsed)} active seconds. Completion events: ${completionEvents}. Free play leaves this result unchanged.`;}}});
const source=new URL(player.iframe.src), fixture=new URL('http://127.0.0.1:5180/tests/browser/multi-player.html');fixture.searchParams.set('channel',source.searchParams.get('channel'));player.iframe.src=fixture.href;
document.querySelector('#complete').onclick=()=>{pending?.complete();pending=undefined;section.hidden=true;};document.querySelector('#unavailable').onclick=()=>{pending?.unavailable();pending=undefined;section.hidden=true;};
</script></body></html>
